  - id: async-gather-results
    title: Concurrent result collection returns awaitables
    category: async-resources
    difficulty: hard
    files:
      app.py: |
        async def double(value: int) -> int:
            return value * 2
        async def double_all(values: list[int]):
            return [double(value) for value in values]
