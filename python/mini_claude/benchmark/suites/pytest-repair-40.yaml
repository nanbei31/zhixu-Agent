    solution:
      app.py: |
        import asyncio
        async def double(value: int) -> int:
            return value * 2
        async def double_all(values: list[int]):
            return list(await asyncio.gather(*(double(value) for value in values)))

  - id: resource-context-close
    title: Context manager leaves resource open
    category: async-resources
    difficulty: medium
    files:
      app.py: |
        class Resource:
            def __init__(self):
                self.closed = False
            def close(self):
                self.closed = True
            def __enter__(self):
                return self
            def __exit__(self, exc_type, exc, traceback):
                return False
    public_test: |
      from app import Resource
      def test_context_closes_resource():
          resource = Resource()
          with resource:
              pass
          assert resource.closed
    hidden_test: |
      import pytest
      from app import Resource
      def test_closes_after_exception():
          resource = Resource()
          with pytest.raises(RuntimeError):
              with resource:
                  raise RuntimeError("boom")
          assert resource.closed
    allowed_changes: [app.py]
    solution:
      app.py: |
        class Resource:
            def __init__(self):
                self.closed = False
            def close(self):
                self.closed = True
            def __enter__(self):
                return self
            def __exit__(self, exc_type, exc, traceback):
                self.close()
                return False

