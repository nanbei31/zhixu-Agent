  - id: exceptions-parse-int
    title: Invalid integer silently returns zero
    category: exceptions
    difficulty: medium
    files:
      app.py: |
        def parse_int(value: str) -> int:
            try:
                return int(value)
            except ValueError:
                return 0
    public_test: |
      import pytest
      from app import parse_int
      def test_invalid_integer_raises():
          with pytest.raises(ValueError):
