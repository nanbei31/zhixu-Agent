  - id: resource-mutable-default
    title: Mutable default leaks state between calls
    category: async-resources
    difficulty: hard
    files:
      app.py: |
        def collect(value: int, values: list[int] = []) -> list[int]:
            values.append(value)
            return values
    public_test: |
      from app import collect
      def test_calls_are_independent():
          assert collect(1) == [1]
          assert collect(2) == [2]
    hidden_test: |
      from app import collect
      def test_explicit_list_is_reused():
          target = [9]
          assert collect(3, target) == [9, 3]
          assert target == [9, 3]
    allowed_changes: [app.py]
    solution:
      app.py: |
        def collect(value: int, values: list[int] | None = None) -> list[int]:
            if values is None:
                values = []
            values.append(value)
            return values
