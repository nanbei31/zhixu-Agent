name: AutoCI Repair

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Target branch to repair and use as the Draft PR base
        required: true
        default: main
        type: string
      setup_command:
        description: Trusted dependency setup command
        required: true
        default: python -m pip install ./python pytest
        type: string
      test_command:
        description: Test command that currently fails
        required: true
        default: python -m pytest -q python/tests
        type: string
      target:
        description: Production file or directory to prioritize
        required: true
        default: python/mini_claude
        type: string
      max_attempts:
        description: Maximum Agent repair attempts
        required: true
        default: 2
        type: number
      dry_run:
        description: Validate the repair without creating a Draft PR
        required: true
        default: true
        type: boolean

concurrency:
  group: autoci-repair-${{ inputs.base_ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair without repository write access
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    env:
      SETUP_COMMAND: ${{ inputs.setup_command }}
      TEST_COMMAND: ${{ inputs.test_command }}
      TARGET: ${{ inputs.target }}
      MAX_ATTEMPTS: ${{ inputs.max_attempts }}
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record immutable base commit
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install Mini Claude
        shell: bash
        run: python -m pip install ./python

      - name: Install trusted project dependencies
        shell: bash
        run: bash -euo pipefail -c "$SETUP_COMMAND"

      - name: Confirm dependency setup kept the checkout clean
        shell: bash
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run isolated AutoCI repair
        id: repair
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MINI_CLAUDE_MODEL: ${{ vars.MINI_CLAUDE_MODEL }}
        run: |
          set +e
          mini-claude-py \
            --fix-ci \
            --test-command "$TEST_COMMAND" \
            --target "$TARGET" \
            --max-fix-attempts "$MAX_ATTEMPTS" \
            --ci-timeout 900 \
            --ci-report "$RUNNER_TEMP/autoci-report.json" \
            --artifacts-dir "$RUNNER_TEMP/autoci-runs"
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/autoci-exit-code.txt"

          mkdir -p "$RUNNER_TEMP/repair-handoff"
          cp "$RUNNER_TEMP/autoci-exit-code.txt" "$RUNNER_TEMP/repair-handoff/"
          if [[ -f "$RUNNER_TEMP/autoci-report.json" ]]; then
            cp "$RUNNER_TEMP/autoci-report.json" "$RUNNER_TEMP/repair-handoff/report.json"
          fi
          run_dir="$(find "$RUNNER_TEMP/autoci-runs" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null || true)"
          if [[ -n "$run_dir" ]]; then
            cp -a "$run_dir/." "$RUNNER_TEMP/repair-handoff/"
          fi

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoci-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-handoff
          if-no-files-found: error
          retention-days: 30

      - name: Require a successful repair and complete handoff
        shell: bash
        run: |
          test "$(cat "$RUNNER_TEMP/autoci-exit-code.txt")" = "0"
          test -s "$RUNNER_TEMP/repair-handoff/report.json"
          test -s "$RUNNER_TEMP/repair-handoff/changes.patch"

  verify:
    name: Independently verify patch without secrets
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPECTED_BASE_SHA: ${{ needs.repair.outputs.base_sha }}
      SETUP_COMMAND: ${{ inputs.setup_command }}
      TEST_COMMAND: ${{ inputs.test_command }}
    steps:
      - name: Check out exact repair base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download repair evidence
        uses: actions/download-artifact@v4
        with:
          name: autoci-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-handoff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install trusted project dependencies
        shell: bash
        run: bash -euo pipefail -c "$SETUP_COMMAND"

      - name: Validate and stage the repair patch
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python -m mini_claude.github.validate_patch \
            --repo "$GITHUB_WORKSPACE" \
            --patch "$RUNNER_TEMP/repair-handoff/changes.patch" \
            --report "$RUNNER_TEMP/repair-handoff/report.json" \
            --base-commit "$EXPECTED_BASE_SHA" \
            --output "$RUNNER_TEMP/repair-handoff/validation.json"

      - name: Run independent verification tests
        shell: bash
        run: |
          set -o pipefail
          bash -euo pipefail -c "$TEST_COMMAND" 2>&1 | tee "$RUNNER_TEMP/repair-handoff/verification.log"

      - name: Upload verified handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoci-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-handoff
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified patch as Draft PR
    if: ${{ inputs.dry_run == false }}
    needs: [repair, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_BASE_SHA: ${{ needs.repair.outputs.base_sha }}
      BASE_REF: ${{ inputs.base_ref }}
      BRANCH_NAME: autoci/fix-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check out exact verified base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.base_sha }}
          fetch-depth: 0

      - name: Download verified handoff
        uses: actions/download-artifact@v4
        with:
          name: autoci-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-handoff

      - name: Build Draft PR body from verified metadata
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python -m mini_claude.github.pr_report \
            --report "$RUNNER_TEMP/verified-handoff/report.json" \
            --validation "$RUNNER_TEMP/verified-handoff/validation.json" \
            --run-url "$RUN_URL" \
            --output "$RUNNER_TEMP/pr-body.md"

      - name: Revalidate and stage only the approved patch
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          python -m mini_claude.github.validate_patch \
            --repo "$GITHUB_WORKSPACE" \
            --patch "$RUNNER_TEMP/verified-handoff/changes.patch" \
            --report "$RUNNER_TEMP/verified-handoff/report.json" \
            --base-commit "$EXPECTED_BASE_SHA" \
            --output "$RUNNER_TEMP/publish-validation.json"
          cmp "$RUNNER_TEMP/verified-handoff/validation.json" "$RUNNER_TEMP/publish-validation.json"

      - name: Commit verified staged files
        shell: bash
        run: |
          git switch -c "$BRANCH_NAME"
          git config user.name "mini-claude-autoci[bot]"
          git config user.email "mini-claude-autoci[bot]@users.noreply.github.com"
          git commit -m "fix: automated CI repair"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Create Draft pull request
        shell: bash
        run: |
          gh pr create \
            --draft \
            --base "$BASE_REF" \
            --head "$BRANCH_NAME" \
            --title "fix: automated repair for $TARGET" \
            --body-file "$RUNNER_TEMP/pr-body.md"
